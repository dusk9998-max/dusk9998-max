name: Paper Dragon

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-dragon
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test collector and renderer
        run: python3 -m unittest discover -s tests -v
      - name: Collect owner activity and draw
        env:
          DRAGON_ACTIVITY_TOKEN: ${{ secrets.DRAGON_ACTIVITY_TOKEN }}
        run: python3 scripts/paper_dragon.py --login dusk9998-max --output-dir dragon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-dragon
          path: |
            dragon/dragon.svg
            dragon/state.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Reject stale source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: paper-dragon
          path: dragon
      - name: Commit changed artwork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- dragon/dragon.svg dragon/state.json
          if git diff --cached --quiet; then
            echo "The dragon is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dragon: fold the next chapter"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD
